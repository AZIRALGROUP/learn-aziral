services:
  learn-telegram:
    image: ${LEARN_TELEGRAM_IMAGE:-learn-telegram:local}
    build:
      context: .
      dockerfile: Dockerfile.telegram.runtime
    container_name: learn-telegram
    env_file: .env.production
    environment:
      NODE_ENV: production
      TELEGRAM_DEV_MODE: "false"
      TELEGRAM_DATABASE: /data/learn.sqlite
      TELEGRAM_PORT: "3002"
    volumes:
      - ./data:/data
    networks:
      - learn-edge
      - deploy_internal
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 80
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

networks:
  learn-edge:
    name: learn-edge
  deploy_internal:
    external: true
