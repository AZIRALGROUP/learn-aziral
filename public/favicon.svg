<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Dark background with subtle gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3366FF"/>
      <stop offset="1" stop-color="#0047FF"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="400" height="400" rx="88" fill="url(#bg)"/>

  <!-- Subtle highlight top-left -->
  <ellipse cx="90" cy="90" rx="140" ry="90" fill="rgba(255,255,255,.06)"/>
  <!-- Brand ambient bottom-right -->
  <ellipse cx="340" cy="340" rx="130" ry="90" fill="rgba(0,71,255,.25)"/>

  <!-- Inner rounded square with brand gradient -->
  <rect x="84" y="84" width="232" height="232" rx="56" fill="url(#brand)"/>

  <!-- Open book icon (Lucide BookOpen — scaled & centered to inner square)
       Original viewBox 0-24, stroke 2. We scale x9 to fit ~216px inside 232px box,
       offset to center: (232-216)/2 = 8 → x:84+8=92, y:84+8=92 -->
  <g transform="translate(92, 92) scale(9)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 7v14"/>
    <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
  </g>
</svg>
